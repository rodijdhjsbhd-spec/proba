# /etc/nginx/sites-available/gigahrushevka — вариант для nginx (сертификат: certbot --nginx).
# Замените dom.example.ru на свой домен.
server {
    listen 80;
    server_name dom.example.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dom.example.ru;

    ssl_certificate     /etc/letsencrypt/live/dom.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dom.example.ru/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        # Host обязателен: по нему сервер проверяет, что игру открыли с этого адреса (Origin)
        proxy_set_header Host $host;
        # Адрес игрока: при TRUST_PROXY=1 сервер берёт ПОСЛЕДНИЙ адрес из X-Forwarded-For — его дописывает nginx
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
